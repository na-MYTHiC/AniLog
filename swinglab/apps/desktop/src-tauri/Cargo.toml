[package]
name = "swinglab-desktop"
version = "0.1.0"
edition = "2021"
description = "SwingLab desktop shell — watches a folder for TrackMan exports"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
