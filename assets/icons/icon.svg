<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" aria-label="AniLog">
  <!-- Big viewBox so iOS rasterizes from a high-res source instead of upscaling
       a tiny canvas. No gradients, no opacity tricks — solid shapes only, which
       survive Safari's lossy icon rasterization much better. -->
  <rect width="512" height="512" rx="112" fill="#1e1e28"/>
  <rect x="112" y="148" width="288" height="40" rx="20" fill="white"/>
  <rect x="112" y="236" width="224" height="40" rx="20" fill="white"/>
  <rect x="112" y="324" width="160" height="40" rx="20" fill="white"/>
  <circle cx="368" cy="344" r="22" fill="white"/>
</svg>
