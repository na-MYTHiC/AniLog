<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" aria-label="AniLog notification badge">
  <!-- The status-bar badge, NOT the app icon.
       Android masks this to a single-colour silhouette using the alpha channel
       and throws the colours away, so it has to be white-on-transparent with
       no background plate. icon-192.png was being used here, and its opaque
       #1e1e28 tile meant the whole square survived the mask — the status bar
       showed a solid white blob instead of a mark.
       Also deliberately chunkier than icon.svg: the bars are twice the
       relative weight, because this is displayed at roughly 24dp and the
       app icon's proportions turn to mush at that size.
       Raster with:
         convert -size 96x96 xc:none -fill white \
           -draw "roundrectangle 12,16 84,31 7,7" \
           -draw "roundrectangle 12,39 68,54 7,7" \
           -draw "roundrectangle 12,62 52,77 7,7" \
           -draw "circle 70,69 70,79" \
           png32:assets/icons/badge-96.png -->
  <rect x="12" y="16" width="72" height="15" rx="7.5" fill="#fff"/>
  <rect x="12" y="39" width="56" height="15" rx="7.5" fill="#fff"/>
  <rect x="12" y="62" width="40" height="15" rx="7.5" fill="#fff"/>
  <circle cx="70" cy="69" r="10" fill="#fff"/>
</svg>
