name: Send AniLog push notifications

# Polls AniList and pushes anything new. AniList has no webhooks, so polling
# is the only option — every 15 minutes is plenty for "an episode aired".
#
# Free on public repositories: GitHub doesn't bill Actions minutes for them.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
    inputs:
      resend_today:
        description: 'Test: resend the last 24h (safe — does not affect normal runs)'
        type: boolean
        default: false

# Needed to commit the last-seen marker back to the repo.
permissions:
  contents: write

concurrency:
  # A slow run must not overlap the next tick, or both could send the same
  # notification before either records that it did.
  group: anilog-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install web-push@3.6.7 --no-save

      # Before the secrets are set this exits 0 with a note saying which are
      # missing, so setup can be finished in any order without a run ever
      # going red. The public VAPID key isn't passed in — the script reads it
      # from scripts/config.js.
      - name: Check AniList and send
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          # Empty on scheduled runs, so the cron path is always normal mode.
          RESEND_TODAY: ${{ inputs.resend_today }}
        run: node tools/send-push.js

      - name: Record what we sent
        run: |
          if [ -n "$(git status --porcelain tools/push-state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/push-state.json
            git commit -m "Record last pushed AniList notification [skip ci]"
            git push
          fi
