name: Send AniLog push notifications

# AniList has no webhooks, so something has to poll it and push what's new.
#
# GitHub does not run a */15 schedule every 15 minutes — measured here, it
# started every 2 to 10 hours. So one job polls every two minutes for an
# hour (tools/push-loop.sh) and starts its own replacement when it ends.
# The schedule below only restarts that chain if it ever breaks.
#
# Free on public repositories: GitHub doesn't bill Actions minutes for them.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
    inputs:
      resend_today:
        description: 'Test: resend the last 24h (safe — does not affect normal runs)'
        type: boolean
        default: false

permissions:
  contents: write   # the push-state branch
  actions: write    # see whether a run is already polling, and start the next

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only one run polls at a time. Not `concurrency:` — that queues every
      # watchdog tick behind the running job and cancels all but the last,
      # filling the Actions tab with cancelled runs. A tick that finds an
      # older run still going simply ends here, green, in under a minute.
      # The second look covers a hand-over: the run that started this one is
      # still "in progress" for a few seconds after it does.
      - name: Is another run already polling?
        id: guard
        if: inputs.resend_today != true
        run: |
          older() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow anilog-push.yml --status in_progress \
              --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length"
          }
          n=$(older || echo 0)
          if [ "${n:-0}" -gt 0 ]; then sleep 45; n=$(older || echo 0); fi
          if [ "${n:-0}" -gt 0 ]; then
            echo "An earlier run is still polling; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '20'

      - run: npm install web-push@3.6.7 --no-save
        if: steps.guard.outputs.skip != 'true'

      # Before the secrets are set the sender exits 0 with a note saying which
      # are missing, so setup can be finished in any order without a run going
      # red. The public VAPID key isn't passed in — the script reads it from
      # scripts/config.js.
      - name: Check AniList and send
        if: steps.guard.outputs.skip != 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          RESEND_TODAY: ${{ inputs.resend_today }}
        run: |
          if [ "$RESEND_TODAY" = "true" ]; then
            bash tools/push-loop.sh once
          else
            bash tools/push-loop.sh loop
          fi

      # Start the replacement before this run ends, so polling never waits on
      # the schedule. After a failure too: the sender fails a run only the
      # first time it meets a problem, and the next job is what notices the
      # secret has been fixed.
      - name: Hand over to the next run
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' && inputs.resend_today != true }}
        run: gh workflow run anilog-push.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
