<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none" aria-label="AniLog">
  <defs>
    <linearGradient id="lm-grad" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="60%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="lm-shine" x1="0" y1="0" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Fills the full square so platforms can mask without breaking the brand -->
  <rect width="36" height="36" rx="10" fill="url(#lm-grad)"/>
  <rect width="36" height="20" rx="10" fill="url(#lm-shine)"/>
  <rect x="0.5" y="0.5" width="35" height="35" rx="9.5" stroke="white" stroke-opacity="0.18" stroke-width="1" fill="none"/>
  <rect x="9"  y="11" width="18" height="3.4" rx="1.7" fill="white"/>
  <rect x="9"  y="17" width="14" height="3.4" rx="1.7" fill="white" fill-opacity="0.78"/>
  <rect x="9"  y="23" width="10" height="3.4" rx="1.7" fill="white" fill-opacity="0.56"/>
  <circle cx="25" cy="24.7" r="1.6" fill="white" fill-opacity="0.92"/>
</svg>
